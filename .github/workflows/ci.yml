name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
        working-directory: nexus-forge-cyto

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dashboard.txt
          pip install -r requirements-api.txt
          pip install pytest pytest-json report 2>/dev/null || pip install pytest
          python -m pytest tests/ -q --ignore=tests/fixtures --ignore=tests/validation
        working-directory: nexus-forge-cyto