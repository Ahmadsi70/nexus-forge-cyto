name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nexus-forge-cyto-batch-linux-x86_64
            bin_glob: target/release/nexus-forge-cyto-batch
          - os: windows-latest
            artifact: nexus-forge-cyto-batch-windows-x86_64
            bin_glob: target/release/nexus-forge-cyto-batch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --bin nexus-forge-cyto-batch
        working-directory: nexus-forge-cyto
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin_glob }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Nexus-Forge Cyto $tag" \
            --notes "Prebuilt geometry batch binaries (Rust κ engine)." \
            dist/nexus-forge-cyto-batch-linux-x86_64/nexus-forge-cyto-batch \
            dist/nexus-forge-cyto-batch-windows-x86_64/nexus-forge-cyto-batch.exe

  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: nexus-forge-cyto-batch-linux-x86_64

      - name: Prepare Docker context
        run: |
          mkdir -p nexus-forge-cyto/target/release
          mv nexus-forge-cyto-batch nexus-forge-cyto/target/release/nexus-forge-cyto-batch
          chmod +x nexus-forge-cyto/target/release/nexus-forge-cyto-batch
          cp -r models/ nexus-forge-cyto/models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: nexus-forge-cyto
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
