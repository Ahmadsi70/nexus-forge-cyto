[workspace]
name = "nexus-forge-cyto"
version = "0.1.0"
description = "Nexus-Forge geometry-only pipeline (Python / Rust)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation]
env = { PYTHONPATH = "services", NEXUS_REPO_ROOT = "." }

[dependencies]
python = ">=3.10,<3.14"
streamlit = ">=1.32,<2.0"
rust = ">=1.75"

[pypi-dependencies]
python-dotenv = ">=1.0"
pandas = ">=2.0"
numpy = ">=1.24"
pyarrow = ">=14.0"
lxml = ">=5.0"
jsonschema = ">=4.20"
scipy = ">=1.11"
fastapi = ">=0.110"
uvicorn = ">=0.27"
python-multipart = ">=0.0.9"
Pillow = ">=10.0"
pytest = ">=8.0"
httpx = ">=0.27"

[tasks]
build = "cargo build --release -p nexus-forge-cyto --bin nexus-forge-cyto-batch"
test = "python -m pytest tests/ -q"
streamlit = "streamlit run services/interface_service/dashboard_app.py --server.port 8501 --server.address 0.0.0.0"
api = "uvicorn api_service.main:app --host 0.0.0.0 --port 8810"
