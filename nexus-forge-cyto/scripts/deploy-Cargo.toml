# Minimal workspace manifest for RunPod / standalone deploy (geometry + cyto only).
[workspace]
members = [
    "nexus-forge-cyto-geometry",
    "nexus-forge-cyto",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
nexus-forge-cyto-geometry = { path = "nexus-forge-cyto-geometry" }

[profile.release]
panic = "abort"
