[package]
name = "nexus-forge-cyto"
version = "0.1.0"
edition = "2021"
description = "Edge Computational Cytology — zero-copy FFI and mmap layer (Step 1)"
license = "LicenseRef-Proprietary"
build = "build.rs"

# `rlib` enables `cargo test` / Rust callers; ship the `cdylib` artifact to Mojo/C++.
[lib]
crate-type = ["cdylib", "rlib"]
name = "nexus_forge_cyto"

[[bin]]
name = "nexus-forge-cyto-batch"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_1_84_plus)'] }

[profile.release]
panic = "abort"

[dependencies]
nexus-forge-cyto-geometry = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `serde_json` is already a normal dependency — no need to redeclare it here.
