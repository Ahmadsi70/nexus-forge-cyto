[workspace]
name = "nexus-forge-cyto"
version = "0.1.0"
description = "Nexus-Forge cytology hybrid pipeline (Python / Rust / Mojo)"
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.14"
streamlit = ">=1.32,<2.0"
mojo = { version = "==0.26.1.0", channel = "https://conda.modular.com/max/" }
rust = ">=1.75"

[pypi-dependencies]
folium = ">=0.15,<0.20"
streamlit-folium = ">=0.18,<0.30"
python-dotenv = ">=1.0,<2.0"
plotly = ">=5.18,<6.0"
pandas = ">=2.0,<3.0"
numpy = ">=1.24,<3.0"
pyarrow = ">=14.0"
lxml = ">=5.0,<6.0"
cellpose = "==4.1.1"
# Cellpose 4.1.1 needs torch >=2.6 for `torch.load(weights_only=True)`; cap below 2.8
# to match the CUDA 12.1 wheel matrix used in our Docker image.
opencv-python-headless = ">=4.9,<5.0"
scikit-image = ">=0.22,<0.26"
tifffile = ">=2024.5.0"
torch = ">=2.6,<2.8"
# torch-geometric wheels are tightly coupled to the torch minor version; pin to
# the band that ships prebuilt binaries for torch 2.6/2.7.
torch-geometric = ">=2.5,<2.8"
scikit-learn = ">=1.3,<2.0"

[tasks]
streamlit = "streamlit run services/interface_service/dashboard_app.py --server.port 8501 --server.address 0.0.0.0"
