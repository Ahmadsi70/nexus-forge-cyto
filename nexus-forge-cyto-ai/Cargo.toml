[package]
name = "nexus-forge-cyto-ai"
version = "0.1.0"
edition = "2021"
description = "Edge Computational Cytology — AI-extended pipeline (Cellpose ingest, GNN inference)"
license = "LicenseRef-Proprietary"
build = "build.rs"

# `rlib` enables `cargo test` / Rust callers; ship the `cdylib` artifact to Mojo/C++.
[lib]
crate-type = ["cdylib", "rlib"]
name = "nexus_forge_cyto_ai"

[[bin]]
name = "nexus-forge-cyto-ai-batch"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_1_84_plus)'] }

[profile.release]
panic = "abort"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16"
libloading = "0.8"
image = "0.24"
tract-onnx = "0.20.0"
openslide = { version = "0.2", optional = true }
nexus-forge-cyto-core = { path = "../nexus-forge-cyto-core" }
nexus-forge-cyto-geometry = { path = "../nexus-forge-cyto-geometry" }

[dev-dependencies]
tempfile = "3"
# `serde_json` is already a normal dependency — no need to redeclare it here.
