[package]
name = "nexus-forge-cyto-core"
version = "0.2.0"
edition = "2021"
description = "Pure geometry CLI — wraps the shared nexus-forge-cyto-geometry engine"
license = "MIT OR Apache-2.0"

[lib]
name = "nexus_forge_cyto_core"
path = "src/lib.rs"

[[bin]]
name = "nexus-core-cli"
path = "src/bin/nexus-core-cli.rs"

[dependencies]
nexus-forge-cyto-geometry = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
